name: Release

# Triggered by pushing a version tag (e.g. `git tag v1.0.0 && git push --tags`)
# — not by merging to main. Builds and publishes a drag-to-Applications
# ShowClock.dmg to GitHub Releases with notes built from commit subjects
# since the last tag (not GitHub's own auto-generate-notes: that only lists
# merged PRs, and this project pushes straight to main — it produced nothing
# but a bare compare link).
#
# Unsigned, not notarized: that requires a paid Apple Developer Program
# membership ($99/year), which this project doesn't have. Gatekeeper will
# warn downloaders that the app is from an "unidentified developer" — the
# release notes below tell them how to get past that (right-click → Open,
# once). See docs/release-process.md if that ever changes.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .app bundle
        run: ./Packaging/build-app.sh "${{ steps.version.outputs.version }}"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: ./Packaging/make-dmg.sh "dist/ShowClock.app" "dist/ShowClock.dmg"

      - name: Generate release notes
        run: |
          cat > notes.md <<'EOF'
          > **Not notarized.** This build isn't signed with a paid Apple Developer ID, so macOS Gatekeeper will say it's from an "unidentified developer" on first launch. To open it: right-click (or Control-click) `ShowClock.app` → **Open** → **Open** again in the confirmation dialog. You only need to do this once.

          ## What's changed
          EOF
          PREV_TAG=$(git tag --sort=-creatordate | grep -vx "${{ github.ref_name }}" | head -1)
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${{ github.ref_name }}" --pretty=format:"- %s" >> notes.md
            {
              echo ""
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
            } >> notes.md
          else
            git log "${{ github.ref_name }}" --pretty=format:"- %s" >> notes.md
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/ShowClock.dmg" \
            --title "ShowClock ${{ github.ref_name }}" \
            --notes-file notes.md
